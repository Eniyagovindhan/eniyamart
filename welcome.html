<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eniya Mart - Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .header {
            background: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 80%;
            margin: 40px auto;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            margin: 20px auto;
            max-width: 500px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        .card h2 {
            color: #333;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 25px;
        }

        .button {
            padding: 12px 20px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .button:hover {
            background: #555;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Eniya Mart</h1>
    <p>Welcome to Eniya Mart</p>
</div>

<div class="container">

    <div class="card">
        <h2>Login Successful!</h2>
        <p>Welcome to Eniya Mart Dashboard.</p>

        <div class="buttons">
            <a href="#" class="button">Products</a>
            <a href="#" class="button">Orders</a>
            <a href="#" class="button">Profile</a>
        </div>
    </div>

</div>

</body>
</html>
